services:
  etl:
    build: .
    volumes:
      - ./data:/app/data
    command: python -m src.main
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: pulseiq-postgres
    environment:
      POSTGRES_DB: pulseiq_warehouse
      POSTGRES_USER: pulseiq_user
      POSTGRES_PASSWORD: pulseiq_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: pulseiq-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "pulseiq-local-dev-secret-change-before-deployment"
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      - postgres
    command: >
      /bin/sh -c "
      superset db upgrade &&
      (superset fab create-admin
      --username admin
      --firstname Admin
      --lastname User
      --email admin@example.com
      --password admin || true) &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "

volumes:
  postgres_data:
  superset_home: